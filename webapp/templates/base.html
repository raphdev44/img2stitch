<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}img2stitch{% endblock %} · img2stitch</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%23e2725b' stroke-width='3' stroke-dasharray='4 3'/></svg>">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</head>
<body data-page="{% block page %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="{{ url_for('web.create') }}">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12" class="hoop"/><path d="M9 19c3-7 11-7 14 0" class="thread"/></svg>
      <span>img2stitch</span>
    </a>
    <nav>
      {% set ep = request.endpoint %}
      <a href="{{ url_for('web.create') }}" class="{{ 'active' if ep == 'web.create' }}">Créer</a>
      <a href="{{ url_for('web.gallery') }}" class="{{ 'active' if ep in ('web.gallery', 'web.design') }}">Galerie</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
