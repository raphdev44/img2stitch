<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}img2stitch{% endblock %} · img2stitch</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</head>
<body data-page="{% block page %}{% endblock %}" data-theme="{% block theme %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="{{ url_for('web.home') }}">
      <img class="brand-logo" src="{{ url_for('static', filename='img/logo.svg', v=1) }}" alt="img2stitch" width="156" height="41">
    </a>
    <nav>
      {% set ep = request.endpoint %}
      <a href="{{ url_for('web.home') }}" class="{{ 'active' if ep == 'web.home' }}">Accueil</a>
      <a href="{{ url_for('web.create') }}" class="{{ 'active' if ep in ('web.create', 'web.create_cross_stitch', 'web.create_hand', 'web.create_streamline') }}">Créer</a>
      <a href="{{ url_for('web.gallery') }}" class="{{ 'active' if ep in ('web.gallery', 'web.design', 'web.edit') }}">Galerie</a>
    </nav>
  </header>
  <main class="container{% if request.endpoint == 'web.home' %} home-container{% endif %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
